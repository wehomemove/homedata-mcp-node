name: Release homedata-mcp (npm)

# Triggers ONLY on tags shaped `v*` (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v*'

# Never cancel an in-flight publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build + publish to npm via OIDC
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Node 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted publishing needs a recent npm. Node 20 ships npm 10, which
      # predates OIDC support, so the runner's npm is upgraded rather than the
      # Node version bumped — a Node bump would change what the package is
      # built and tested against, which is a different decision.
      #
      # The version is PRINTED, not assumed. Nobody on this change could verify
      # the exact minimum from evidence we hold, so the release run records what
      # it actually used; if a publish ever fails on version grounds the log
      # answers it instead of the next person re-deriving it.
      #
      # Pinned to the npm 11 line, not @latest. The first v1.0.0 run, 38007259563
      # (10 Oct 2026), installed npm 12.2.0, which requires node ^22.22.2 ||
      # ^24.15.0 || >=26 and failed EBADENGINE on node v20.20.2, so Publish was
      # skipped. npm 11 declares node ^20.17.0 || >=22.9.0; 11.5.1 is the floor
      # for trusted publishing. Moving to npm 12 means moving Node first.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@>=11.5.1 <12"
          echo "npm $(npm --version) on node $(node --version)"

      - name: Check the npm OIDC exchange
        continue-on-error: true
        run: |
          set +x
          echo "::add-mask::$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          idtoken=$(curl --silent --max-time 30 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r '.value // empty' 2>/dev/null) || exit 0
          [ -n "$idtoken" ] || exit 0
          echo "::add-mask::$idtoken"
          status=$(curl --silent --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $idtoken" \
            --output "$response" --write-out '%{http_code}' \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/homedata-mcp) || true
          token=$(jq -r '.token // empty' "$response" 2>/dev/null) || token=''
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
          fi
          printf 'HTTP status: %s\n' "$status"
          jq -c '{error, message} | with_entries(select(.value != null))' "$response" 2>/dev/null || true

      # NO NODE_AUTH_TOKEN. With trusted publishing the identity comes from the
      # OIDC token that `id-token: write` mints, and npm exchanges it for a
      # short-lived credential at publish time.
      #
      # Passing the env var with the secret ABSENT is worse than not passing it:
      # setup-node writes an EMPTY _authToken into .npmrc, npm then attempts
      # token auth, fails, and never reaches the OIDC path — a confusing
      # failure that looks like a bad token rather than a missing publisher.
      - name: Publish to npm
        run: npm publish --provenance --access public --loglevel verbose
