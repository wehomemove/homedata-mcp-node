name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'   # Mondays 06:23 UTC, for the currency check below
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: build + test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          # These jobs run npm scripts from the pull request; do not leave a token
          # in the git config for them to read.
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run build
      - run: npm test

  parity:
    # One guard, from the Python package, judges both servers: the tools this
    # server lists and the request each one sends must match the manifest.
    name: parity with the Python package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          # These jobs run npm scripts from the pull request; do not leave a token
          # in the git config for them to read.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.13'

      - run: npm ci
      - run: npm run build

      # The vendored manifest must be byte-identical to the commit it records.
      # Without this, the parity step below could pass against a manifest other
      # than the one this package ships.
      #
      # Exit 1 and exit 2 are different events and the annotation must say which.
      # Exit 1 is about THE CHANGE: the vendored bytes are not the recorded
      # commit's, and re-running will produce the same answer. Exit 2 is about
      # THE INFRASTRUCTURE: nothing was compared, so it says nothing about the
      # manifest, and re-running is the right response.
      #
      # Both still FAIL the job. An infrastructure failure that went green would
      # be a check reporting a comparison it never made, which is the worse bug:
      # this step exists to stop the parity step below running against unverified
      # bytes, and it cannot do that by passing when it could not look.
      #
      # Deliberately NOT retried here. A retry hides the distinction instead of
      # drawing it, and the point is that whoever reads the red knows which
      # happened.
      - name: Vendored manifest matches its source commit
        run: |
          set +e
          node scripts/vendor-manifest.mjs --check
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 1 ]; then
            echo "::error title=Vendored manifest does not match its source commit::This is about the change, not the network. Re-running will give the same answer. Re-vendor from the recorded commit."
          elif [ "$code" -eq 2 ]; then
            echo "::error title=Could not check the vendored manifest (infrastructure)::Nothing was compared, so this says NOTHING about the manifest. Re-running is the right response. Do not read this as a parity defect."
          else
            echo "::error title=vendor-manifest --check exited $code::Unexpected exit code. The command documents 0, 1 and 2 only."
          fi
          exit 1

      - name: Install the Python package at the vendored commit
        run: |
          REF=$(node -p "require('./src/manifest/SOURCE.json').ref")
          REPO=$(node -p "require('./src/manifest/SOURCE.json').repository")
          echo "installing $REPO@$REF"
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/$REPO@$REF"

      - name: Dump this server's tools and requests
        run: node scripts/parity-dump.mjs parity-out

      - name: Judge them with the Python guard
        run: python -m homedata_mcp.parity --tools-list parity-out/tools.json --requests parity-out/requests.json

  currency:
    # vendor-manifest --check asks whether the vendored files match the commit
    # they RECORD. This asks whether that commit is still the upstream head:
    # without it the package can vendor a year-old tool list and stay green,
    # because both the parity job and the hash check would still pass.
    # Weekly, not per-PR: main moving is not a reason to fail someone's PR.
    name: vendored manifest is still current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '22'

      # Exit 1 means re-vendor (the failure message says how); exit 2 means the
      # upstream head could not be resolved, which is not a pass.
      - run: node scripts/check-manifest-current.mjs
