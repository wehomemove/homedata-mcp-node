# A READ-ONLY probe. It publishes nothing and creates nothing.
#
# WHY IT EXISTS. The commission for wt_dead3c933c04bf2f recorded "no credentials
# exist" as measured. That was measured on the BOX — no ~/.npmrc, npm whoami
# ENEEDAUTH, no NPM_TOKEN in any launchd env — and never on the REPO, which is
# where release.yml actually reads its token from. There has been an NPM_TOKEN
# repo secret since 2026-05-11, the day 0.1.0 was published.
#
# A secret's value cannot be read, so its validity is UNKNOWN rather than
# assumed either way. This answers it without a password reset on a live
# business account, which is the irreversible alternative.
#
# It also settles a contradiction in release.yml: that job is NAMED "publish to
# npm via OIDC" and requests id-token: write, yet authenticates with
# NODE_AUTH_TOKEN from a secret. Trusted publishing needs no token. Exactly one
# of the name and the mechanism is wrong, and the last step here says which.
#
# Nothing prints a token. `npm whoami` prints a username; Actions masks secrets
# regardless.
name: Credential probe (read-only)

on:
  workflow_dispatch:

jobs:
  probe:
    name: what can the stored credential do
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Every step captures its exit code on the SAME line and prints the body
      # beside it. An exit code alone has lied in both directions today.
      - name: Who does the stored token authenticate as?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm whoami > out.txt 2>&1
          code=$?
          set -e
          echo "exit=$code"
          cat out.txt
          if [ "$code" -ne 0 ]; then
            echo "::notice title=Token does not authenticate::Revoked, expired or never valid. The reset path is needed."
          fi

      - name: What may it publish?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm access list packages > access.txt 2>&1
          code=$?
          set -e
          echo "exit=$code"
          cat access.txt

      # Deliberately WITHOUT the token, so the registry is asked whether it will
      # accept an OIDC identity for this repository and workflow. --dry-run
      # publishes nothing; the error text is the answer.
      - name: Does the registry accept an OIDC identity for this workflow?
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          npm ci
          npm run build
          set +e
          npm publish --dry-run --provenance --access public > oidc.txt 2>&1
          code=$?
          set -e
          echo "exit=$code"
          cat oidc.txt
