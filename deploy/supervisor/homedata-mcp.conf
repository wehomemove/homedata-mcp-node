; /etc/supervisor/conf.d/homedata-mcp.conf on the production box.
; Secrets and settings come from /home/forge/mcp.homedata.co.uk/.env (0600,
; never in git); see docs/chatgpt-app/DEPLOY.md.
[program:homedata-mcp]
directory=/home/forge/mcp.homedata.co.uk/current
command=/usr/bin/node --env-file=/home/forge/mcp.homedata.co.uk/.env /home/forge/mcp.homedata.co.uk/current/dist/http.js
user=forge
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/forge/mcp.homedata.co.uk/logs/homedata-mcp.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
