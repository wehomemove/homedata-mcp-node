# /etc/nginx/sites-available/mcp.homedata.co.uk on the production box,
# symlinked into sites-enabled. Cloudflare proxies the hostname with SSL mode
# Full (strict), so the origin presents a Cloudflare Origin CA certificate.
# The default log format records no request headers, so bearer tokens are
# never written to disk.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.homedata.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.homedata.co.uk;

    ssl_certificate /etc/nginx/ssl/mcp.homedata.co.uk/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/mcp.homedata.co.uk/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    access_log /var/log/nginx/mcp.homedata.co.uk-access.log;
    error_log /var/log/nginx/mcp.homedata.co.uk-error.log;

    location / {
        proxy_pass http://127.0.0.1:8191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
